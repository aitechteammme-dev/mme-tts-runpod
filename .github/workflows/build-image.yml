name: Build TTS v4 test image

# Runs ONLY for pushes to the branch tts-v3 (change the branch name below if yours differs), or by hand FROM that branch.
# Pushes only two tags: :v4 and :v4-<commit>. It never touches :latest, :v2 or :v3.
on:
  push:
    branches:
      - tts-v3
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # a manual run from any other branch (for example main) is skipped, so main code can never be published as :v4
    if: github.ref == 'refs/heads/tts-v3'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (v4 tags only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aitechteammme-dev/mme-tts-runpod:v4
            ghcr.io/aitechteammme-dev/mme-tts-runpod:v4-${{ github.sha }}
