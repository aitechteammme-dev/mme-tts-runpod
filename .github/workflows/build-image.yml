name: Build TTS v4 test image

# Keep the file name .github/workflows/build-image-v3-test.yml in the TTS worker repo (branch `tts-v3` ONLY) and replace its content with this.
# It is a SEPARATE workflow from "Build and Publish Chatterbox TTS" (which pushes :latest and :v2 on every push to main and is left untouched).
# This one runs only for pushes to the branch tts-v3 (or by hand) and pushes ONLY the tag :v4, so :latest, :v2 and the broken :v3 cannot change.
on:
  push:
    branches:
      - tts-v3
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (tag v4 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aitechteammme-dev/mme-tts-runpod:v4
